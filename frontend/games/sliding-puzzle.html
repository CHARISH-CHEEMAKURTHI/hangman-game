<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sliding Puzzle - Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .slide-hud { display: flex; justify-content: center; gap: 30px; font-weight: 700; margin-bottom: 10px; }
  .slide-board {
    display: grid; grid-template-columns: repeat(4, 84px); grid-template-rows: repeat(4, 84px);
    gap: 6px; background: #12183a; padding: 8px; border-radius: 10px; margin: 0 auto;
  }
  .slide-tile {
    background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 800; cursor: pointer; color: white;
  }
  .slide-tile.blank { background: transparent; cursor: default; }
</style>
</head>
<body>
  <div class="game-page">
    <a class="back-link" href="../index.html">&larr; Back to Arcade Hub</a>
    <h1>🧩 Sliding Puzzle</h1>
    <div class="panel" style="text-align:center;">
      <div class="slide-hud">
        <div>Moves: <span id="moves">0</span></div>
        <div>Best: <span id="best">-</span></div>
      </div>
      <p class="status-line" id="status">Click a tile next to the blank space to slide it. Arrange 1-15 in order.</p>
      <div class="slide-board" id="board"></div>
      <div class="row" style="justify-content:center; margin-top:10px;">
        <button class="btn secondary" id="restartBtn">Shuffle</button>
      </div>
    </div>
  </div>
  <script src="../js/games/sliding-puzzle.js"></script>
</body>
</html>
