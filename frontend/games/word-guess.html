<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Guess - Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .wg-grid { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; margin: 16px auto; width: fit-content; }
  .wg-row { display: grid; grid-template-columns: repeat(5, 52px); gap: 6px; }
  .wg-tile {
    width: 52px; height: 52px; border: 2px solid rgba(255,255,255,0.15); border-radius: 6px;
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800;
    text-transform: uppercase; color: var(--text);
  }
  .wg-tile.correct { background: var(--good); border-color: var(--good); color: #0b0e1c; }
  .wg-tile.present { background: var(--warn); border-color: var(--warn); color: #0b0e1c; }
  .wg-tile.absent { background: #2a2f4f; border-color: #2a2f4f; }
  .wg-keyboard { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 16px; }
  .wg-keyrow { display: flex; gap: 5px; }
  .wg-keyboard button { padding: 10px 8px; min-width: 32px; border-radius: 6px; border: none; background: var(--panel-light); color: var(--text); font-weight: 700; cursor: pointer; }
  .wg-keyboard button.correct { background: var(--good); color: #0b0e1c; }
  .wg-keyboard button.present { background: var(--warn); color: #0b0e1c; }
  .wg-keyboard button.absent { background: #2a2f4f; }
  .wg-keyboard button.wide { min-width: 52px; font-size: 0.75rem; }
</style>
</head>
<body>
  <div class="game-page">
    <a class="back-link" href="../index.html">&larr; Back to Arcade Hub</a>
    <h1>🟩 Word Guess</h1>
    <div class="panel" style="text-align:center;">
      <p class="status-line" id="status">Guess the 5-letter word in 6 tries.</p>
      <div class="wg-grid" id="grid"></div>
      <div class="wg-keyboard" id="keyboard"></div>
      <div class="row" style="justify-content:center; margin-top:14px;">
        <button class="btn secondary" id="restartBtn">New Word</button>
      </div>
    </div>
  </div>
  <script src="../js/games/word-guess.js"></script>
</body>
</html>
