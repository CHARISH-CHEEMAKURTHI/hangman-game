<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2048 - Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .g2048-hud { display: flex; justify-content: center; gap: 30px; font-weight: 700; margin-bottom: 10px; }
  .g2048-board {
    display: grid; grid-template-columns: repeat(4, 90px); grid-template-rows: repeat(4, 90px);
    gap: 10px; background: #12183a; padding: 10px; border-radius: 12px; margin: 0 auto;
    position: relative; touch-action: none;
  }
  .g2048-cell {
    background: rgba(255,255,255,0.06); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 800; color: #eef0fb;
  }
  .g2048-cell[data-v="2"] { background: #3a4270; }
  .g2048-cell[data-v="4"] { background: #454f8a; }
  .g2048-cell[data-v="8"] { background: #6c5ce7; }
  .g2048-cell[data-v="16"] { background: #8064f0; }
  .g2048-cell[data-v="32"] { background: #a06cf0; }
  .g2048-cell[data-v="64"] { background: #c06cf0; }
  .g2048-cell[data-v="128"] { background: #00b4d2; font-size: 1.4rem; }
  .g2048-cell[data-v="256"] { background: #00d2ff; font-size: 1.4rem; }
  .g2048-cell[data-v="512"] { background: #2ecc71; font-size: 1.4rem; }
  .g2048-cell[data-v="1024"] { background: #ffd166; color: #222; font-size: 1.2rem; }
  .g2048-cell[data-v="2048"] { background: #ff6b6b; font-size: 1.2rem; }
</style>
</head>
<body>
  <div class="game-page">
    <a class="back-link" href="../index.html">&larr; Back to Arcade Hub</a>
    <h1>🔢 2048</h1>
    <div class="panel" style="text-align:center;">
      <div class="g2048-hud">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="best">0</span></div>
      </div>
      <p class="status-line" id="status">Use arrow keys / WASD or swipe to merge tiles.</p>
      <div class="g2048-board" id="board"></div>
      <div class="row" style="justify-content:center; margin-top:10px;">
        <button class="btn secondary" id="restartBtn">Restart</button>
      </div>
    </div>
  </div>
  <script src="../js/games/2048.js"></script>
</body>
</html>
