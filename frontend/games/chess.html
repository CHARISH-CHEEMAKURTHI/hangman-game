<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chess - Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .chess-wrap { text-align: center; position: relative; }
  .chess-board {
    display: inline-grid;
    grid-template-columns: repeat(8, 56px);
    grid-template-rows: repeat(8, 56px);
    margin: 16px auto;
    border: 4px solid #12183a;
    border-radius: 6px;
    overflow: hidden;
  }
  .chess-sq {
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.1rem;
    position: relative;
    cursor: pointer;
    user-select: none;
  }
  .chess-sq.light { background: #2a3160; }
  .chess-sq.dark { background: #171b38; }
  .chess-sq.selected { outline: 3px solid var(--accent-2); outline-offset: -3px; }
  .chess-sq.last { background: rgba(255, 209, 102, 0.25); }
  .chess-sq.check { background: rgba(255, 107, 107, 0.5); }
  .chess-sq .dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(0, 210, 255, 0.55); position: absolute; }
  .chess-sq .ring { position: absolute; inset: 4px; border: 4px solid rgba(255, 107, 107, 0.65); border-radius: 50%; }
  .promo-overlay {
    position: absolute; inset: 0; background: rgba(10, 12, 24, 0.9);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    border-radius: 10px; z-index: 5;
  }
  .promo-overlay button { font-size: 2rem; background: var(--panel-light); border: none; border-radius: 10px; padding: 10px 14px; cursor: pointer; }
</style>
</head>
<body>
  <div class="game-page">
    <a class="back-link" href="../index.html">&larr; Back to Arcade Hub</a>
    <h1>♟️ Chess</h1>

    <div class="mode-tabs">
      <button data-mode="local" class="active">Local 2P</button>
      <button data-mode="online">Online 1v1</button>
    </div>

    <div class="panel" id="onlinePanel" style="display:none;">
      <div class="row">
        <button class="btn" id="createRoomBtn">Create Room</button>
        <input type="text" id="joinCodeInput" placeholder="Room code" maxlength="5" style="text-transform:uppercase;" />
        <button class="btn secondary" id="joinRoomBtn">Join Room</button>
      </div>
      <div id="roomInfo" style="margin-top:14px;"></div>
    </div>

    <div class="panel chess-wrap">
      <p class="status-line" id="status">White's turn</p>
      <div class="chess-board" id="board"></div>
      <div class="row" style="justify-content:center; margin-top:10px;">
        <button class="btn secondary" id="resetBtn">Restart</button>
        <button class="btn danger" id="resignBtn" style="display:none;">Resign</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="../js/socket-client.js"></script>
  <script src="../js/games/chess-engine.js"></script>
  <script src="../js/games/chess.js"></script>
</body>
</html>
