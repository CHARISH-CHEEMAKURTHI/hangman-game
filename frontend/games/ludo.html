<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ludo Race - Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .ludo-dice { font-size: 3rem; text-align: center; margin: 10px 0; min-height: 1.4em; }
  .ludo-players { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .ludo-player-chip { padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="game-page">
    <a class="back-link" href="../index.html">&larr; Back to Arcade Hub</a>
    <h1>🎲 Ludo Race</h1>
    <p>Simplified Ludo for 2-4 players: one token each, roll a 6 to go again, land on a rival to send them home.</p>

    <div class="panel" id="lobbyPanel">
      <div class="row">
        <button class="btn" id="createRoomBtn">Create Room</button>
        <input type="text" id="joinCodeInput" placeholder="Room code" maxlength="5" style="text-transform:uppercase;" />
        <button class="btn secondary" id="joinRoomBtn">Join Room</button>
      </div>
      <div id="roomInfo" style="margin-top:14px;"></div>
      <button class="btn" id="startGameBtn" style="display:none; margin-top:10px;">Start Game</button>
    </div>

    <div class="panel" id="gamePanel" style="display:none; text-align:center;">
      <p class="status-line" id="status"></p>
      <div class="ludo-players" id="playersHud"></div>
      <canvas id="canvas" width="420" height="420"></canvas>
      <div class="ludo-dice" id="diceDisplay">🎲</div>
      <div class="row" style="justify-content:center; gap:12px;">
        <button class="btn" id="rollBtn">Roll Dice</button>
        <button class="btn" id="moveBtn" style="display:none;">Move Token</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="../js/socket-client.js"></script>
  <script src="../js/games/ludo.js"></script>
</body>
</html>
