<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tower of Hanoi - Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .hanoi-hud { display: flex; justify-content: center; gap: 30px; font-weight: 700; margin-bottom: 10px; }
  .hanoi-pegs { display: flex; justify-content: center; gap: 40px; align-items: flex-end; height: 260px; margin: 20px auto; }
  .hanoi-peg { width: 140px; height: 240px; position: relative; cursor: pointer; display: flex; flex-direction: column-reverse; align-items: center; }
  .hanoi-peg::before { content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 8px; height: 220px; background: #4a3f8f; border-radius: 4px; }
  .hanoi-peg.selected::before { background: var(--accent-2); }
  .hanoi-base { position: absolute; bottom: -6px; left: 0; width: 100%; height: 10px; background: #12183a; border-radius: 4px; }
  .hanoi-disk { height: 24px; border-radius: 6px; margin-bottom: 4px; z-index: 1; }
</style>
</head>
<body>
  <div class="game-page">
    <a class="back-link" href="../index.html">&larr; Back to Arcade Hub</a>
    <h1>🗼 Tower of Hanoi</h1>
    <div class="mode-tabs">
      <button data-n="3" class="active">3 Disks</button>
      <button data-n="4">4 Disks</button>
      <button data-n="5">5 Disks</button>
      <button data-n="6">6 Disks</button>
    </div>
    <div class="panel" style="text-align:center;">
      <div class="hanoi-hud">
        <div>Moves: <span id="moves">0</span></div>
        <div>Minimum: <span id="minMoves">7</span></div>
      </div>
      <p class="status-line" id="status">Move all disks to the last peg. Click a peg to pick up, click another to drop.</p>
      <div class="hanoi-pegs" id="pegs"></div>
      <div class="row" style="justify-content:center; margin-top:10px;">
        <button class="btn secondary" id="restartBtn">Restart</button>
      </div>
    </div>
  </div>
  <script src="../js/games/hanoi.js"></script>
</body>
</html>
