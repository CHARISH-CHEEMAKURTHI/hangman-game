<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Whack-a-Mole - Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .whack-hud { display: flex; justify-content: center; gap: 30px; font-weight: 700; margin-bottom: 10px; }
  .whack-board { display: grid; grid-template-columns: repeat(3, 110px); grid-template-rows: repeat(3, 110px); gap: 12px; margin: 20px auto; width: fit-content; }
  .whack-hole { background: #2a1f14; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; cursor: pointer; overflow: hidden; }
  .whack-hole.up { background: #3a2a1c; }
</style>
</head>
<body>
  <div class="game-page">
    <a class="back-link" href="../index.html">&larr; Back to Arcade Hub</a>
    <h1>🔨 Whack-a-Mole</h1>
    <div class="panel" style="text-align:center;">
      <div class="whack-hud">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">30</span>s</div>
        <div>Best: <span id="best">0</span></div>
      </div>
      <p class="status-line" id="status">Click Start, then whack the moles before they duck back down!</p>
      <div class="whack-board" id="board"></div>
      <div class="row" style="justify-content:center; margin-top:10px;">
        <button class="btn" id="startBtn">Start</button>
      </div>
    </div>
  </div>
  <script src="../js/games/whack-a-mole.js"></script>
</body>
</html>
