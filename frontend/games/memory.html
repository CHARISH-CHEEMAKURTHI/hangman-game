<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Match - Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .mem-grid {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    gap: 10px;
    justify-content: center;
    margin: 20px auto;
  }
  .mem-card {
    width: 80px; height: 80px;
    background: var(--panel-light);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .mem-card.flipped, .mem-card.matched { background: var(--bg-alt); }
  .mem-card.matched { opacity: 0.55; cursor: default; }
  .mem-hud { display: flex; justify-content: center; gap: 30px; font-weight: 700; margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="game-page">
    <a class="back-link" href="../index.html">&larr; Back to Arcade Hub</a>
    <h1>🧠 Memory Match</h1>

    <div class="mode-tabs">
      <button data-mode="solo" class="active">Solo</button>
      <button data-mode="local2p">Local 2P (pass &amp; play)</button>
    </div>

    <div class="panel" style="text-align:center;">
      <div class="mem-hud" id="hud"></div>
      <p class="status-line" id="status">Find every pair!</p>
      <div class="mem-grid" id="grid"></div>
      <div class="row" style="justify-content:center; margin-top:10px;">
        <button class="btn secondary" id="restartBtn">Restart</button>
      </div>
    </div>
  </div>
  <script src="../js/games/memory.js"></script>
</body>
</html>
