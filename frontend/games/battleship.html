<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Battleship - Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .bs-boards { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .bs-board-wrap { text-align: center; }
  .bs-board {
    display: inline-grid; grid-template-columns: repeat(10, 30px); grid-template-rows: repeat(10, 30px);
    gap: 2px; background: #12183a; padding: 6px; border-radius: 8px;
  }
  .bs-cell { width: 30px; height: 30px; background: #1c2140; border-radius: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
  .bs-cell.ship { background: #4a3f8f; }
  .bs-cell.preview { background: rgba(0, 210, 255, 0.4); }
  .bs-cell.preview-invalid { background: rgba(255, 107, 107, 0.4); }
  .bs-cell.hit { background: var(--bad); }
  .bs-cell.miss { background: #2a2f4f; }
  .bs-cell.enemy { cursor: pointer; }
  .bs-cell.enemy:hover { outline: 1px solid var(--accent-2); }
</style>
</head>
<body>
  <div class="game-page">
    <a class="back-link" href="../index.html">&larr; Back to Arcade Hub</a>
    <h1>🚢 Battleship</h1>
    <p>Online only. Place your 5 ships (sizes 5,4,3,3,2), then take turns firing at your opponent's grid.</p>

    <div class="panel" id="lobbyPanel">
      <div class="row">
        <button class="btn" id="createRoomBtn">Create Room</button>
        <input type="text" id="joinCodeInput" placeholder="Room code" maxlength="5" style="text-transform:uppercase;" />
        <button class="btn secondary" id="joinRoomBtn">Join Room</button>
      </div>
      <div id="roomInfo" style="margin-top:14px;"></div>
    </div>

    <div class="panel" id="gamePanel" style="display:none;">
      <p class="status-line" id="status"></p>

      <div id="placementControls" class="row" style="justify-content:center; gap:12px;">
        <span id="placingLabel"></span>
        <button class="btn secondary" id="orientationBtn">Orientation: Horizontal</button>
        <button class="btn secondary" id="randomBtn">Randomize</button>
        <button class="btn secondary" id="undoShipBtn">Undo Last Ship</button>
      </div>

      <div class="bs-boards">
        <div class="bs-board-wrap">
          <h3>Your Fleet</h3>
          <div class="bs-board" id="myBoard"></div>
        </div>
        <div class="bs-board-wrap">
          <h3>Enemy Waters</h3>
          <div class="bs-board" id="enemyBoard"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="../js/socket-client.js"></script>
  <script src="../js/games/battleship.js"></script>
</body>
</html>
